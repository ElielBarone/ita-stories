<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6c945">
<title>🇮🇹 Italian Stories</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#202124;--muted:#6b7280;--accent:#e2ad00;--soft:#fff3b8;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:rgba(247,247,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.head{max-width:820px;margin:auto;padding:18px 20px 14px}
h1{margin:0;font-size:clamp(1.35rem,4vw,2rem);line-height:1.2}
.sub{color:var(--muted);font-size:.9rem;margin-top:5px}
main{max-width:820px;margin:auto;padding:26px 20px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 8px 30px rgba(0,0,0,.05);transition:.15s}
.card:hover{background:var(--soft)}
.card h2{margin:0 0 6px;font-size:1.15rem}
.level{display:inline-block;font-size:.72rem;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.badge{font-size:.75rem;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:5px}
</style>
</head>
<body>
<header>
<div class="head">
<h1>🇮🇹 Italian Stories</h1>
<div class="sub">Tap a story to read it. Tap a sentence in the story to see its English translation.</div>
</div>
</header>
<main>
<div class="grid">
<a class="card" href="marco-the-baker.html">
<span class="level">A2–B1</span>
<h2>I Wake Up at 3:45 AM and I Love It</h2>
<p>Marco, a baker, wakes up before dawn to open his family's bakery and greet the whole town.</p>
<div class="badge">▶ Includes video</div>
</a>
</div>
</main>
</body>
</html>
